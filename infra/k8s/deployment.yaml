apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-wrapper
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-wrapper
  template:
    metadata:
      labels:
        app: llm-wrapper
    spec:
      containers:
      - name: llm-wrapper
        image: youruser/llm-wrapper:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: llm-wrapper-config
        - secretRef:
            name: llm-wrapper-secrets
